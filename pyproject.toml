[project]
name = "python-voice-caller"
version = "0.1.0"
description = "Scaffold for the Pretty Good AI voice challenge"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-dotenv>=1.0",
]

[tool.setuptools]
py-modules = [
  "app",
  "batch_runner",
  "call_runner",
  "call_service",
  "clients",
  "config",
  "cli",
  "engine",
  "launcher",
  "scenarios",
]

[tool.black]
line-length = 88
